name: Windows First Visit Lab

# Phase 3A: the first-visit lane captures the broken/cold first visit that no
# other CI lane exercises (generic multi-host fixture, three dependency waves,
# self-report verdict) and measures what Phase 4 has to improve. It never signs
# in AMO: it consumes the exact `windows-offline-template` artifact of a
# release-scripts run.

on:
  workflow_run:
    workflows: ['Release Installation Scripts']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      template_run_id:
        description: 'release-scripts run id that produced windows-offline-template'
        required: false
        type: string
      template_sha:
        description: 'commit SHA whose release-scripts run provides the template'
        required: false
        type: string
      scenarios:
        description: 'comma-separated scenarios (settled,hot,class-boot,floor; control is the floor alias)'
        required: false
        default: 'settled,class-boot'
        type: string
      repetitions:
        description: 'repetitions per scenario'
        required: false
        default: '1'
        type: string
      lab_scenario:
        description: 'lab inventory scenario that provides the VM id and baseline snapshot'
        required: false
        default: 'win11-education-existing-empty'
        type: string

concurrency:
  # Unique per run: with a shared group GitHub keeps only one pending run and
  # cancels the older one when a new lane run is created (observed three times
  # in Phase 3A.2: 37068692262, 37073942340, 37074231254). The runner and the
  # heartbeat lab lock serialize the runs instead.
  group: windows-first-visit-lab-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  first-visit:
    name: Windows first visit lab
    runs-on: [self-hosted, Linux, X64, proxmox, openpath]
    # Phase 5.2 C4: 8 scenes x 30-min scene budget + overhead = 255 min, under
    # the 80% limit (288 min) with margin.
    timeout-minutes: 360
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The changed-path detection diffs HEAD against its parent; a shallow
          # clone would silently skip the lane (Phase 3A finding).
          fetch-depth: 0

      - name: Superseded auto-run guard
        id: supersede
        if: github.event_name == 'workflow_run'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          # Phase 5.2 C5: only the newest non-cancelled release-scripts run
          # gives the verdict; older auto-runs end as skipped-superseded.
          Import-Module (Resolve-Path 'tests/e2e/ci/first-visit/FirstVisitSupersedeGuard.psm1') -Force
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $runs = @()
          try {
            $response = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/release-scripts.yml/runs?branch=main&per_page=30" -Headers $headers -TimeoutSec 60
            $runs = @($response.workflow_runs)
          }
          catch {
            Write-Host "Supersede guard: REST query failed (fails open): $($_.Exception.Message)"
          }
          $decision = Get-OpenPathFirstVisitSupersedeDecision -TriggerRunId $env:TRIGGER_RUN_ID -TriggerCreatedAt $env:TRIGGER_CREATED_AT -Runs $runs
          Write-Host "Supersede guard: superseded=$($decision.superseded) newer=$($decision.newerRunId) reason=$($decision.reason)"
          if ($decision.superseded) {
            "## Windows First Visit Lab`n`nskipped-superseded: a newer release-scripts run ($($decision.newerRunId)) exists; the newest run owns the verdict." | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "skip=$($decision.superseded.ToString().ToLowerInvariant())"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "newer_run_id=$($decision.newerRunId)"

      - name: Detect relevant changes
        id: scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          & (Resolve-Path 'tests/e2e/ci/first-visit/Resolve-FirstVisitScope.ps1') -RepoRoot (Get-Location).Path

      - name: Resolve lane plan
        id: plan
        shell: pwsh
        env:
          REQUESTED_SCENARIOS: ${{ inputs.scenarios }}
          REQUESTED_REPETITIONS: ${{ inputs.repetitions }}
        run: |
          Import-Module (Resolve-Path 'tests/e2e/ci/first-visit/FirstVisitLanePlan.psm1') -Force
          $plan = Get-OpenPathFirstVisitScenarioPlan -EventName "${{ github.event_name }}" -RequestedScenarios $env:REQUESTED_SCENARIOS -RequestedRepetitions $env:REQUESTED_REPETITIONS
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "scenarios=$($plan.scenarios)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "repetitions=$($plan.repetitions)"
          Write-Host "first-visit plan: scenarios=$($plan.scenarios) repetitions=$($plan.repetitions) source=$($plan.source)"
      - name: Resolve template source
        id: template
        if: steps.scope.outputs.run == 'true' && steps.supersede.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.template_run_id }}
          INPUT_SHA: ${{ inputs.template_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          Import-Module (Resolve-Path 'tests/e2e/ci/first-visit/FirstVisitTemplateSource.psm1') -Force
          $plan = Get-FirstVisitTemplateSourcePlan -EventName $env:EVENT_NAME -InputRunId $env:INPUT_RUN_ID -InputSha $env:INPUT_SHA -WorkflowRunId $env:WORKFLOW_RUN_ID -WorkflowRunHeadSha $env:WORKFLOW_RUN_HEAD_SHA
          try {
            $resolved = Resolve-FirstVisitTemplateRun -Plan $plan
          }
          catch {
            Write-Error "INFRA: no successful release-scripts run with windows-offline-template ($($_.Exception.Message))."
            exit 2
          }
          # Phase 5.3 P3: the latest mode must pick the newest successful main
          # run; anything newer without the template is a real lag and makes
          # the lane INFRA (the old branch+status=success query returned stale
          # runs and the lane measured a product from 2026-10-03).
          $lag = 0
          if ($resolved.PSObject.Properties['lag']) { $lag = [int]$resolved.lag }
          Write-Host "Template resolver: mode=$($resolved.mode) run=$($resolved.runId) sha=$($resolved.templateSha) lag=$lag newest_success=$($resolved.newestSuccessRunId)"
          if ($plan.mode -eq 'latest' -and $lag -gt 0) {
            Write-Error "INFRA: the newest successful main release-scripts run is $($resolved.newestSuccessRunId); resolved $($resolved.runId) is $lag successful run(s) behind."
            exit 2
          }
          # The live-signal capabilities must be derived from the template's own
          # SHA, not from the checkout: a red build cannot emit signals it never
          # shipped (Phase 3A.2 K1 gating).
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "run_id=$($resolved.runId)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "template_sha=$($resolved.templateSha)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "template_lag=$lag"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Template: $($resolved.runId) sha $($resolved.templateSha) (mode $($resolved.mode), lag $lag)"
          Write-Host "Using release-scripts run $($resolved.runId) (template sha $($resolved.templateSha), mode $($resolved.mode))"

      - name: Download exact candidate artifacts
        if: steps.scope.outputs.run == 'true' && steps.supersede.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = '${{ steps.template.outputs.run_id }}'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $artifacts = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$runId/artifacts?per_page=100" -Headers $headers -TimeoutSec 60
          foreach ($name in @('windows-offline-template', 'windows-personalized-exe')) {
            $artifact = @($artifacts.artifacts | Where-Object { $_.name -eq $name }) | Select-Object -First 1
            if (-not $artifact) { Write-Error "INFRA: artifact $name missing in run $runId"; exit 2 }
            $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
            Invoke-WebRequest -Uri $artifact.archive_download_url -Headers $headers -OutFile $zip -TimeoutSec 300
            $dir = if ($name -eq 'windows-offline-template') { 'windows-offline-template-assets' } else { 'windows-personalized-exe' }
            Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          }
          Get-ChildItem windows-offline-template-assets, windows-personalized-exe | Select-Object Name, Length

      - name: Reclaim lab lock from finished runs
        if: steps.scope.outputs.run == 'true' && steps.supersede.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & (Resolve-Path 'tests/e2e/ci/controllers/proxmox-disposable-windows-release-lock.ps1') `
            -RunId "${{ github.run_id }}" -RunAttempt ([int]'${{ github.run_attempt }}') -ReclaimFinishedOwners

      - name: Require lab controller
        if: steps.scope.outputs.run == 'true' && steps.supersede.outputs.skip != 'true'
        shell: pwsh
        env:
          OPENPATH_FIRST_VISIT_CONTROLLER: ${{ secrets.OPENPATH_FIRST_VISIT_CONTROLLER }}
          OPENPATH_DESKTOP_SURVIVAL_CONTROLLER: ${{ secrets.OPENPATH_DESKTOP_SURVIVAL_CONTROLLER }}
        run: |
          $controller = if ($env:OPENPATH_FIRST_VISIT_CONTROLLER) { $env:OPENPATH_FIRST_VISIT_CONTROLLER } else { $env:OPENPATH_DESKTOP_SURVIVAL_CONTROLLER }
          if (-not $controller -or -not (Test-Path -LiteralPath $controller -PathType Leaf)) {
            $fallback = Join-Path (Get-Location) 'tests/e2e/ci/controllers/proxmox-disposable-windows-controller.ps1'
            if (-not (Test-Path -LiteralPath $fallback -PathType Leaf)) {
              Write-Error 'BLOCKED_PLATFORM_VALIDATION: no lab controller is configured.'
              exit 2
            }
          }

      - name: Run first-visit suite
        id: suite
        if: steps.scope.outputs.run == 'true' && steps.supersede.outputs.skip != 'true'
        shell: pwsh
        env:
          OPENPATH_FIRST_VISIT_CONTROLLER: ${{ secrets.OPENPATH_FIRST_VISIT_CONTROLLER }}
          OPENPATH_DESKTOP_SURVIVAL_CONTROLLER: ${{ secrets.OPENPATH_DESKTOP_SURVIVAL_CONTROLLER }}
          OPENPATH_SOURCE_SHA: ${{ steps.template.outputs.template_sha }}
          OPENPATH_FIRST_VISIT_LAB_SCENARIO: ${{ inputs.lab_scenario || 'win11-education-existing-empty' }}
        run: |
          $controller = if ($env:OPENPATH_FIRST_VISIT_CONTROLLER) { $env:OPENPATH_FIRST_VISIT_CONTROLLER } else { $env:OPENPATH_DESKTOP_SURVIVAL_CONTROLLER }
          if (-not $controller) { $controller = Join-Path (Get-Location) 'tests/e2e/ci/controllers/proxmox-disposable-windows-controller.ps1' }
          $root = Join-Path $env:RUNNER_TEMP 'openpath-first-visit'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $template = (Resolve-Path 'windows-offline-template-assets/OpenPath-Windows-Setup-Template.exe').Path
          $personalized = (Get-ChildItem 'windows-personalized-exe' -Filter '*.exe' | Select-Object -First 1).FullName
          $scenarios = '${{ steps.plan.outputs.scenarios }}'
          if (-not $scenarios) { $scenarios = 'settled,class-boot' }
          $repetitions = [int]('${{ steps.plan.outputs.repetitions }}' -replace '^$', '1')
          & (Resolve-Path 'tests/e2e/ci/run-windows-first-visit-suite.ps1') `
            -RunId "${{ github.run_id }}" -RunAttempt ([int]'${{ github.run_attempt }}') `
            -ArtifactsRoot $root -TemplatePath $template -PersonalizedExePath $personalized `
            -ControllerCommand $controller -Scenarios ($scenarios -split ',') -Repetitions $repetitions
          exit $LASTEXITCODE

      - name: Aggregate results
        if: always() && steps.scope.outputs.run == 'true' && steps.supersede.outputs.skip != 'true'
        shell: pwsh
        env:
          OPENPATH_TEMPLATE_LAG: ${{ steps.template.outputs.template_lag }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'openpath-first-visit'
          $summaryJson = Join-Path $root 'first-visit-summary.json'
          $summaryMd = Join-Path $root 'first-visit-summary.md'
          $exit = 0
          try {
            & (Resolve-Path 'tests/e2e/ci/aggregate-windows-first-visit.ps1') `
              -RunId "${{ github.run_id }}" -RunAttempt ([int]'${{ github.run_attempt }}') `
              -EvidenceRoot $root -SummaryJsonPath $summaryJson -SummaryMarkdownPath $summaryMd | Out-Null
            $exit = $LASTEXITCODE
          }
          catch {
            Write-Host "INFRA: first-visit aggregation could not run: $($_.Exception.Message)"
            "## First-visit lane`n`nINFRA: aggregation failed: $($_.Exception.Message)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          if (Test-Path -LiteralPath $summaryMd) { Get-Content -LiteralPath $summaryMd -Raw | Add-Content -Path $env:GITHUB_STEP_SUMMARY }
          exit $exit

      - name: Release lab lock on cancellation
        if: cancelled()
        shell: pwsh
        run: |
          & (Resolve-Path 'tests/e2e/ci/controllers/proxmox-disposable-windows-release-lock.ps1') `
            -RunId "${{ github.run_id }}" -RunAttempt ([int]'${{ github.run_attempt }}')

      - name: Upload first-visit evidence
        if: always() && steps.scope.outputs.run == 'true' && steps.supersede.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-first-visit-evidence
          path: ${{ runner.temp }}/openpath-first-visit
          if-no-files-found: warn
