name: Release Installation Scripts

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'package.json'
      - 'package-lock.json'
      - 'patches/**'
      - 'tsconfig.base.json'
      - 'turbo.json'
      - '.github/actions/**'
      - 'api/**'
      - 'linux/**'
      - 'runtime/**'
      - 'firefox-extension/**'
      - 'tests/e2e/**'
      - 'tests/selenium/**'
      - 'scripts/windows-offline-installer-canary.mjs'
      - 'windows/**'
      - '.github/workflows/release-scripts.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  # ============================================
  # Windows offline installer template (pinned NSIS)
  # ============================================
  windows-offline-template:
    name: Build Windows Offline Installer Template
    runs-on: windows-2025
    outputs:
      contrast-artifact-id: ${{ steps.contrast-input-upload.outputs.artifact-id }}
      template-artifact-id: ${{ steps.template-upload.outputs.artifact-id }}
      personalized-exe-artifact-id: ${{ steps.personalized-exe-upload.outputs.artifact-id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Node dependencies
        run: npm ci

      - name: Build Firefox extension artifacts
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $programFiles = [Environment]::GetEnvironmentVariable('ProgramFiles')
          $edgeCandidates = @()
          foreach ($programFilesRoot in @($programFilesX86, $programFiles)) {
            if ($programFilesRoot) {
              $edgeCandidates += Join-Path $programFilesRoot 'Microsoft\Edge\Application\msedge.exe'
            }
          }
          $edgePath = $edgeCandidates |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $edgePath) {
            throw 'Microsoft Edge is required to create managed Chromium metadata for the offline template'
          }
          $env:OPENPATH_CHROMIUM_PACKAGER = $edgePath
          $env:OPENPATH_CHROMIUM_REQUIRE_MANAGED = 'true'
          npm run build --workspace=@openpath/shared
          npm run build --workspace=@openpath/firefox-extension
          npm run build:chromium-managed --workspace=@openpath/firefox-extension -- --require-managed

      - name: Prepare AMO-signed Firefox release artifacts
        uses: ./.github/actions/prepare-firefox-release-artifacts
        with:
          web-ext-api-key: ${{ secrets.WEB_EXT_API_KEY }}
          web-ext-api-secret: ${{ secrets.WEB_EXT_API_SECRET }}

      - name: Download and verify pinned offline payloads
        shell: pwsh
        run: node windows/offline-installer/scripts/download-pinned-payloads.mjs --repo-root .

      - name: Install pinned NSIS 3.10
        run: choco install nsis --version=3.10 -y --no-progress

      - name: Assert NSIS compiler hash before compiling
        shell: pwsh
        run: |
          Get-Content windows/offline-installer/nsis-hashes.json | Out-Host
          & (Resolve-Path 'windows/offline-installer/scripts/verify-nsis.ps1')
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error title=supply-chain-violation::makensis.exe failed the committed hash assertion.'
            exit 1
          }

      - name: Build and verify offline payload manifest
        run: node windows/offline-installer/scripts/build-payload-manifest.mjs --repo-root . --out windows/offline-installer/build/payload-manifest.json

      - name: Compile NSIS template
        uses: joncloud/makensis-action@v4
        with:
          script-file: windows/offline-installer/OpenPath-Windows-Setup.nsi
          arguments: '/V3 /DREPO_ROOT=${{ github.workspace }}'

      - name: Re-verify compiler hash after compile
        if: always()
        shell: pwsh
        run: |
          & (Resolve-Path 'windows/offline-installer/scripts/verify-nsis.ps1')
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error title=supply-chain-violation::NSIS compiler hash changed during the build; refusing to publish the template.'
            exit 1
          }

      - name: Append trailer placeholder
        run: |
          node windows/offline-installer/scripts/generate-trailer-placeholder.mjs windows/offline-installer/build/trailer-placeholder.bin
          node windows/offline-installer/scripts/append-trailer-placeholder.mjs windows/offline-installer/build/OpenPath-Windows-Setup.exe windows/offline-installer/build/trailer-placeholder.bin windows/offline-installer/build/OpenPath-Windows-Setup-Template.exe

      - name: Validate appended trailer round-trip
        run: node --import tsx --test windows/offline-installer/tests/trailer-roundtrip.test.mjs

      - name: Create personalized NSIS executable
        shell: pwsh
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP 'openpath-offline-installer-e2e-config.json'
          $personalizedPath = Join-Path $env:RUNNER_TEMP 'OpenPath-Windows-Setup-E2E.exe'
          @{
            schemaVersion = 1
            apiUrl = 'https://localhost:18443'
            classroomId = 'release-e2e-classroom'
            enrollmentToken = 'release-e2e-enrollment-token'
            enrollmentTokenExpiresAt = '2036-01-01T00:00:00.000Z'
            captivePortalDomains = @()
            options = @{
              approvedStudentBrowsers = @('Firefox')
              installFirefoxIfMissing = $true
              enforceManagedBrowserBoundary = $true
              appControlProfile = 'StrictApplicationAllowlist'
              approvedApplicationCatalog = @{ schemaVersion = 1; applications = @() }
            }
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $configPath -Encoding UTF8

          node --import tsx windows/offline-installer/scripts/create-personalized-test-installer.mjs `
            --template windows/offline-installer/build/OpenPath-Windows-Setup-Template.exe `
            --output $personalizedPath `
            --config $configPath

      - name: Validate personalized trailer with PowerShell
        shell: pwsh
        run: |
          $personalizedPath = Join-Path $env:RUNNER_TEMP 'OpenPath-Windows-Setup-E2E.exe'
          $validationPath = Join-Path $env:RUNNER_TEMP 'openpath-offline-installer-e2e-trailer-validation.json'
          $readerSucceeded = $false
          try {
            $readerPath = (Resolve-Path 'windows/offline-installer/scripts/Read-Trailer.ps1').Path
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $readerPath `
              -ExecutablePath $personalizedPath `
              -OutputConfigPath $validationPath
            $nativeExitCode = $LASTEXITCODE
            $readerSucceeded = $nativeExitCode -eq 0 -and (Test-Path -LiteralPath $validationPath -PathType Leaf)
          } catch {
            $readerSucceeded = $false
          } finally {
            Remove-Item -LiteralPath $validationPath -Force -ErrorAction SilentlyContinue
          }
          if (-not $readerSucceeded) {
            Write-Host '::error::The personalized trailer failed canonical PowerShell validation before NSIS execution.'
            exit 1
          }

      - name: Prepare PolicyConverter contrast inputs
        id: contrast-inputs
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'openpath-policy-converter-contrast-inputs'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $executable = Join-Path $env:RUNNER_TEMP 'OpenPath-Windows-Setup-E2E.exe'
          $copiedExecutable = Join-Path $root 'OpenPath-Windows-Setup-E2E.exe'
          $probe = Join-Path $root 'openpath-e2e-probe.exe'
          Copy-Item -LiteralPath $executable -Destination $copiedExecutable -Force
          Import-Module (Resolve-Path 'tests/e2e/ci/BrowserBoundaryProbe.psm1') -Force -ErrorAction Stop
          New-OpenPathProbePayloadBinary -OutputPath $probe
          @{
            schemaVersion = 1
            executableFile = 'OpenPath-Windows-Setup-E2E.exe'
            executableSha256 = (Get-FileHash -LiteralPath $copiedExecutable -Algorithm SHA256).Hash
            probePayloadFile = 'openpath-e2e-probe.exe'
            probePayloadSha256 = (Get-FileHash -LiteralPath $probe -Algorithm SHA256).Hash
            sourceSha = '${{ github.sha }}'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'sha256-manifest.json') -Encoding UTF8

      - name: Upload PolicyConverter contrast inputs
        id: contrast-input-upload
        if: steps.contrast-inputs.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: windows-policy-converter-contrast-inputs
          path: ${{ runner.temp }}/openpath-policy-converter-contrast-inputs
          if-no-files-found: error

      - name: Upload template artifacts
        id: template-upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-offline-template
          path: |
            windows/offline-installer/build/OpenPath-Windows-Setup-Template.exe
            windows/offline-installer/build/OpenPath-Windows-Setup-Template.exe.sha256
            windows/offline-installer/build/payload-manifest.json
          if-no-files-found: error

      - name: Upload exact personalized executable for desktop qualification
        id: personalized-exe-upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-personalized-exe
          path: ${{ runner.temp }}/OpenPath-Windows-Setup-E2E.exe
          if-no-files-found: error

  policy-converter-contrast:
    name: PolicyConverter ${{ matrix.mode }} contrast
    needs: [windows-offline-template, windows-personalized-http-e2e, windows-desktop-survival]
    if: ${{ needs.windows-offline-template.result == 'success' && needs.windows-personalized-http-e2e.result == 'success' && needs.windows-desktop-survival.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [Untouched, Started]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download exact template artifact
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.windows-offline-template.outputs.template-artifact-id }}
          path: windows-offline-template-assets

      - name: Download exact HTTP candidate artifact
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.windows-personalized-http-e2e.outputs.candidate-artifact-id }}
          path: windows-personalized-exe

      - name: Download exact contrast inputs
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.windows-offline-template.outputs.contrast-artifact-id }}
          path: ${{ runner.temp }}/openpath-policy-converter-contrast-inputs

      - name: Verify PolicyConverter contrast input hashes
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'openpath-policy-converter-contrast-inputs'
          $manifest = Get-Content -LiteralPath (Join-Path $root 'sha256-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.sourceSha -ne '${{ github.sha }}') { throw 'contrast-source-sha-mismatch' }
          foreach ($input in @(
            @{ File = $manifest.executableFile; Hash = $manifest.executableSha256 },
            @{ File = $manifest.probePayloadFile; Hash = $manifest.probePayloadSha256 }
          )) {
            $actual = (Get-FileHash -LiteralPath (Join-Path $root $input.File) -Algorithm SHA256).Hash
            if ($actual -ne $input.Hash) { throw 'contrast-input-hash-mismatch' }
          }

      - name: Require hosted disposable runner controller
        shell: pwsh
        run: |
          $controller = Join-Path $env:GITHUB_WORKSPACE 'tests/e2e/ci/controllers/hosted-windows-controller.ps1'
          if (-not (Test-Path -LiteralPath $controller -PathType Leaf)) {
            Write-Error 'BLOCKED_PLATFORM_VALIDATION: the hosted disposable runner controller is missing.'
            exit 2
          }

      - name: Run PolicyConverter contrast in an independent guest
        shell: pwsh
        env:
          OPENPATH_SOURCE_SHA: ${{ github.sha }}
        run: |
          $inputs = Join-Path $env:RUNNER_TEMP 'openpath-policy-converter-contrast-inputs'
          $manifest = Get-Content -LiteralPath (Join-Path $inputs 'sha256-manifest.json') -Raw | ConvertFrom-Json
          $root = Join-Path $env:RUNNER_TEMP 'openpath-policy-converter-contrast-${{ matrix.mode }}'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $template = (Resolve-Path 'windows-offline-template-assets/OpenPath-Windows-Setup-Template.exe').Path
          $candidate = (Resolve-Path 'windows-personalized-exe/OpenPath-personalized-download.exe').Path
          @{ schemaVersion = 2; contrastInputs = $inputs; probePayloadSha256 = $manifest.probePayloadSha256; executableSha256 = $manifest.executableSha256; targetHarness = 'tests/e2e/ci/run-windows-policy-converter-contrast.ps1' } |
            ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $root 'controller-input.json') -Encoding UTF8
          & (Resolve-Path 'tests/e2e/ci/run-windows-desktop-survival-suite.ps1') `
            -SuiteKind PolicyConverterContrast `
            -PolicyConverterMode '${{ matrix.mode }}' `
            -RunId "${{ github.run_id }}" `
            -RunAttempt ([int]'${{ github.run_attempt }}') `
            -ArtifactsRoot $root `
            -TemplatePath $template `
            -PersonalizedExePath $candidate `
            -ControllerCommand (Join-Path $env:GITHUB_WORKSPACE 'tests/e2e/ci/controllers/hosted-windows-controller.ps1')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Resolve-Path 'tests/e2e/ci/aggregate-windows-policy-converter-contrast.ps1') `
            -Mode '${{ matrix.mode }}' `
            -RunId "${{ github.run_id }}" `
            -RunAttempt ([int]'${{ github.run_attempt }}') `
            -EvidenceRoot $root `
            -SourceCommitSha '${{ github.sha }}' `
            -TemplatePath $template `
            -PersonalizedExePath $candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload PolicyConverter contrast evidence
        id: contrast-evidence-upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-policy-converter-contrast-${{ matrix.mode }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openpath-policy-converter-contrast-${{ matrix.mode }}
          if-no-files-found: error

  policy-converter-contrast-bundle:
    name: PolicyConverter contrast evidence bundle
    needs: policy-converter-contrast
    outputs:
      evidence-artifact-id: ${{ steps.contrast-bundle-upload.outputs.artifact-id }}
    if: ${{ needs.policy-converter-contrast.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download both same-run contrast evidence artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: windows-policy-converter-contrast-*-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: contrast-evidence

      - name: Require both contrast modes
        shell: bash
        run: |
          set -euo pipefail
          test "$(find contrast-evidence -type f -name 'contrast-untouched-aggregate.json' | wc -l)" -eq 1
          test "$(find contrast-evidence -type f -name 'contrast-started-aggregate.json' | wc -l)" -eq 1

      - name: Upload complete same-run contrast bundle
        id: contrast-bundle-upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-policy-converter-contrast-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: contrast-evidence
          if-no-files-found: error

  # Run the HTTP-to-EXE path on a fresh runner. The physical NSIS lane above
  # changes Windows policy while testing the installer and must not poison the
  # PowerShell process used to start this lane.
  windows-personalized-http-e2e:
    name: Windows Personalized HTTP-to-EXE E2E
    runs-on: windows-2025
    timeout-minutes: 35
    outputs:
      candidate-artifact-id: ${{ steps.personalized-candidate-upload.outputs.artifact-id }}
    needs: windows-offline-template
    if: needs.windows-offline-template.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Node dependencies
        run: npm ci

      - name: Build shared workspace
        run: npm run build --workspace=@openpath/shared

      - name: Download verified template artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-offline-template
          path: windows/offline-installer/build

      - name: Execute personalized HTTP download-to-EXE E2E
        shell: pwsh
        env:
          OPENPATH_E2E_TEMPLATE_COMMIT: ${{ github.sha }}
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'openpath-windows-personalized-offline-installer-e2e'
          & (Resolve-Path 'tests/e2e/ci/run-windows-personalized-offline-installer-e2e.ps1') `
            -TemplatePath (Resolve-Path 'windows/offline-installer/build/OpenPath-Windows-Setup-Template.exe').Path `
            -TemplateCommit $env:OPENPATH_E2E_TEMPLATE_COMMIT `
            -ArtifactsRoot $evidenceRoot `
            -GenerateOnly
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload personalized HTTP-to-EXE E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-personalized-offline-installer-e2e-evidence
          path: ${{ runner.temp }}/openpath-windows-personalized-offline-installer-e2e/*.json
          if-no-files-found: error

      - name: Upload exact HTTP-generated candidate
        id: personalized-candidate-upload
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: windows-personalized-http-candidate
          path: |
            ${{ runner.temp }}/openpath-windows-personalized-offline-installer-e2e/OpenPath-personalized-download.exe
            ${{ runner.temp }}/openpath-windows-personalized-offline-installer-e2e/generated-executable-descriptor.json
          if-no-files-found: error

  # ============================================
  # Build and Release Installation Scripts
  # ============================================
  windows-desktop-survival:
    name: Windows Desktop Survival
    runs-on: [self-hosted, Linux, X64, proxmox, openpath]
    timeout-minutes: 45
    outputs:
      evidence-artifact-id: ${{ steps.desktop-evidence-upload.outputs.artifact-id }}
    needs: [windows-offline-template, windows-personalized-http-e2e]
    if: ${{ needs.windows-offline-template.result == 'success' && needs.windows-personalized-http-e2e.result == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download exact candidate artifacts
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.windows-offline-template.outputs.template-artifact-id }}
          path: windows-offline-template-assets

      - name: Download exact personalized executable
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.windows-personalized-http-e2e.outputs.candidate-artifact-id }}
          path: windows-personalized-exe

      - name: Require external disposable VM controller
        shell: pwsh
        env:
          OPENPATH_DESKTOP_SURVIVAL_CONTROLLER: ${{ secrets.OPENPATH_DESKTOP_SURVIVAL_CONTROLLER }}
        run: |
          if (-not $env:OPENPATH_DESKTOP_SURVIVAL_CONTROLLER -or -not (Test-Path -LiteralPath $env:OPENPATH_DESKTOP_SURVIVAL_CONTROLLER -PathType Leaf)) {
            Write-Error 'BLOCKED_PLATFORM_VALIDATION: no authorized external disposable-VM controller is configured.'
            exit 2
          }

      - name: Record controller evidence
        shell: pwsh
        env:
          OPENPATH_DESKTOP_SURVIVAL_CONTROLLER: ${{ secrets.OPENPATH_DESKTOP_SURVIVAL_CONTROLLER }}
          OPENPATH_SOURCE_SHA: ${{ github.sha }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'openpath-windows-desktop-survival'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $template = (Resolve-Path 'windows-offline-template-assets/OpenPath-Windows-Setup-Template.exe').Path
          $personalized = (Resolve-Path 'windows-personalized-exe/OpenPath-personalized-download.exe').Path
          $controllerInput = Join-Path $root 'controller-input.json'
          '{}' | Set-Content -LiteralPath $controllerInput -Encoding UTF8
          & (Resolve-Path 'tests/e2e/ci/run-windows-desktop-survival-suite.ps1') -SuiteKind DesktopSurvival -RunId "${{ github.run_id }}" -RunAttempt ([int]'${{ github.run_attempt }}') -ArtifactsRoot $root -TemplatePath $template -PersonalizedExePath $personalized -ControllerCommand $env:OPENPATH_DESKTOP_SURVIVAL_CONTROLLER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Resolve-Path 'tests/e2e/ci/aggregate-windows-desktop-survival.ps1') -RunId "${{ github.run_id }}" -RunAttempt ([int]'${{ github.run_attempt }}') -EvidenceRoot $root -SourceCommitSha '${{ github.sha }}' -TemplatePath $template -PersonalizedExePath $personalized
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate desktop-survival evidence for exact candidate
        shell: pwsh
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'openpath-windows-desktop-survival'
          $evidence = Join-Path $evidenceRoot 'aggregate.json'
          if (-not (Test-Path -LiteralPath $evidence -PathType Leaf)) { throw 'Windows Desktop Survival evidence artifact is missing.' }
          node scripts/validate-windows-desktop-survival-evidence.mjs `
            --evidence $evidence `
            --evidence-root $evidenceRoot `
            --source-sha '${{ github.sha }}' `
            --template-sha256 (Get-FileHash -LiteralPath (Resolve-Path 'windows-offline-template-assets/OpenPath-Windows-Setup-Template.exe') -Algorithm SHA256).Hash.ToLowerInvariant() `
            --personalized-exe-sha256 (Get-FileHash -LiteralPath (Resolve-Path 'windows-personalized-exe/OpenPath-personalized-download.exe') -Algorithm SHA256).Hash.ToLowerInvariant() `
            --run-id '${{ github.run_id }}' `
            --run-attempt '${{ github.run_attempt }}'

      - name: Upload Windows Desktop Survival evidence
        id: desktop-evidence-upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-desktop-survival-evidence
          path: ${{ runner.temp }}/openpath-windows-desktop-survival
          if-no-files-found: error

  release:
    name: Build and Release Scripts
    runs-on: ubuntu-latest
    needs:
      [
        windows-offline-template,
        policy-converter-contrast,
        policy-converter-contrast-bundle,
        windows-personalized-http-e2e,
        windows-desktop-survival,
      ]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.windows-offline-template.result == 'success' && needs.policy-converter-contrast.result == 'success' && needs.policy-converter-contrast-bundle.result == 'success' && needs.windows-personalized-http-e2e.result == 'success' && needs.windows-desktop-survival.result == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version and prepare variables
        id: vars
        run: |
          echo "📦 Extracting version from VERSION file..."

          VERSION=$(cat VERSION 2>/dev/null || echo "4.1.0")
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="scripts-v${VERSION}-${SHORT_SHA}"

          echo "  Version: $VERSION"
          echo "  Short SHA: $SHORT_SHA"
          echo "  Tag: $TAG"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "release_name=Installation Scripts v${VERSION} (${SHORT_SHA})" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build Firefox Extension
        uses: ./.github/actions/build-workspaces
        with:
          build-shared: 'false'
          build-api: 'false'
          build-extension: 'true'

      - name: Validate package contents
        run: |
          echo "🔍 Validating package structure before creating release..."
          chmod +x tests/e2e/pre-install-validation.sh
          ./tests/e2e/pre-install-validation.sh

      - name: Download exact same-run Windows qualification artifacts
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.windows-desktop-survival.outputs.evidence-artifact-id }}
          path: release-windows-desktop-survival

      - name: Download exact same-run PolicyConverter contrast bundle
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.policy-converter-contrast-bundle.outputs.evidence-artifact-id }}
          path: release-windows-policy-converter-contrast

      - name: Download exact same-run Windows binary artifacts
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.windows-offline-template.outputs.template-artifact-id }}
          path: release-windows-binaries

      - name: Download exact same-run HTTP candidate
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.windows-personalized-http-e2e.outputs.candidate-artifact-id }}
          path: release-windows-http-candidate

      - name: Validate exact same-run Windows qualification bundle
        shell: bash
        run: |
          set -euo pipefail
          evidence="release-windows-desktop-survival/aggregate.json"
          root="release-windows-desktop-survival"
          template=$(find release-windows-binaries -type f -name 'OpenPath-Windows-Setup-Template.exe' -print -quit)
          personalized=$(find release-windows-http-candidate -type f -name 'OpenPath-personalized-download.exe' -print -quit)
          test -n "$template" && test -n "$personalized" && test -f "$evidence"
          node scripts/validate-windows-desktop-survival-evidence.mjs \
            --evidence "$evidence" \
            --evidence-root "$root" \
            --source-sha "${{ github.sha }}" \
            --template-sha256 "$(sha256sum "$template" | cut -d' ' -f1)" \
            --personalized-exe-sha256 "$(sha256sum "$personalized" | cut -d' ' -f1)" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}"
          for mode in Untouched Started; do
            contrast=$(find release-windows-policy-converter-contrast -type f -name "contrast-${mode,,}-aggregate.json" -print -quit)
            test -n "$contrast"
            contrast_root=$(dirname "$contrast")
            node scripts/validate-windows-policy-converter-contrast-evidence.mjs \
              --evidence "$contrast" \
              --evidence-root "$contrast_root" \
              --source-sha "${{ github.sha }}" \
              --template-sha256 "$(sha256sum "$template" | cut -d' ' -f1)" \
              --personalized-exe-sha256 "$(sha256sum "$personalized" | cut -d' ' -f1)" \
              --run-id "${{ github.run_id }}" \
              --run-attempt "${{ github.run_attempt }}" \
              --mode "$mode"
          done

      - name: Require same-commit CI, E2E, and installer evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/require-release-quality-gate.mjs \
            --sha "${{ github.sha }}" \
            --require "CI::CI Success" \
            --require "E2E Tests::E2E Summary" \
            --require "Installer Contracts::Installer Contracts Success" \
            --timeout-minutes 90 \
            --poll-seconds 30

      - name: Package Linux scripts
        run: |
          echo "🐧 Packaging Linux installation scripts..."

          VERSION="${{ steps.vars.outputs.version }}"
          PACKAGE_NAME="openpath-linux-v${VERSION}.tar.gz"

          # Create tarball with all necessary Linux files
          echo "  → Creating tarball..."
          tar -czf "$PACKAGE_NAME" \
            linux/install.sh \
            linux/uninstall.sh \
            linux/lib/ \
            linux/scripts/ \
            runtime/ \
            firefox-extension/

          # Verify
          if [ -f "$PACKAGE_NAME" ]; then
            SIZE=$(du -h "$PACKAGE_NAME" | cut -f1)
            echo "  ✓ Linux package created: ${PACKAGE_NAME} (${SIZE})"
            
            # List contents for verification
            echo "  → Package contents:"
            tar -tzf "$PACKAGE_NAME" | head -20
          else
            echo "  ✗ Error: Linux package not created"
            exit 1
          fi

      - name: Package Windows scripts
        run: |
          echo "🪟 Packaging Windows installation scripts..."

          VERSION="${{ steps.vars.outputs.version }}"
          PACKAGE_NAME="windows-v${VERSION}.zip"

          # Create ZIP with all Windows files
          echo "  → Creating ZIP archive..."
          zip -r -q "$PACKAGE_NAME" windows/ runtime/ VERSION

          # Verify
          if [ -f "$PACKAGE_NAME" ]; then
            SIZE=$(du -h "$PACKAGE_NAME" | cut -f1)
            echo "  ✓ Windows package created: ${PACKAGE_NAME} (${SIZE})"

            # List contents for verification
            echo "  → Package contents:"
            unzip -l "$PACKAGE_NAME" | head -20
          else
            echo "  ✗ Error: Windows package not created"
            exit 1
          fi

      - name: Download offline installer template artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-offline-template
          path: windows-offline-template-assets

      - name: Generate release checksums
        run: |
          echo "🔐 Generating SHA256 checksums for release artifacts..."

          VERSION="${{ steps.vars.outputs.version }}"
          WIN_PKG="windows-v${VERSION}.zip"
          LIN_PKG="openpath-linux-v${VERSION}.tar.gz"

          sha256sum "$WIN_PKG" > "${WIN_PKG}.sha256"
          sha256sum "$LIN_PKG" > "${LIN_PKG}.sha256"

          echo "  ✓ ${WIN_PKG}.sha256: $(cat ${WIN_PKG}.sha256)"
          echo "  ✓ ${LIN_PKG}.sha256: $(cat ${LIN_PKG}.sha256)"

      - name: Create and push tag
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "🏷️  Resolving immutable tag: $TAG -> $SOURCE_SHA"

          set +e
          git ls-remote --exit-code origin "refs/tags/${{ steps.vars.outputs.tag }}" >/dev/null 2>&1
          tag_lookup_status=$?
          set -e

          if [ "$tag_lookup_status" -eq 0 ]; then
            git fetch --no-tags --force origin "refs/tags/${{ steps.vars.outputs.tag }}:refs/tags/${{ steps.vars.outputs.tag }}"
            existing_target="$(git rev-parse "$TAG^{commit}")"
            if [ "$existing_target" != "$SOURCE_SHA" ]; then
              echo "::error title=Immutable tag conflict::Tag $TAG has a different target ($existing_target); expected $SOURCE_SHA."
              exit 1
            fi
            echo "Tag $TAG already points to $SOURCE_SHA; idempotent success."
          elif [ "$tag_lookup_status" -eq 2 ]; then
            git tag "$TAG" "$SOURCE_SHA"
            git -c core.hooksPath=/dev/null push origin "refs/tags/$TAG"
            git fetch --no-tags --force origin "refs/tags/${{ steps.vars.outputs.tag }}:refs/tags/${{ steps.vars.outputs.tag }}"
            remote_target="$(git rev-parse "$TAG^{commit}")"
            if [ "$remote_target" != "$SOURCE_SHA" ]; then
              echo "::error title=Immutable tag verification failed::Tag $TAG resolves to $remote_target after push; expected $SOURCE_SHA."
              exit 1
            fi
            echo "Created and verified tag $TAG -> $SOURCE_SHA."
          else
            echo "::error title=Tag lookup failed::Could not resolve remote tag $TAG (git exit $tag_lookup_status)."
            exit "$tag_lookup_status"
          fi

      - name: Verify existing GitHub Release assets before idempotent success
        id: existing-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/openpath-existing-release.json"
          response_status="$(curl --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$release_json" -w '%{http_code}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"

          if [ "$response_status" = "200" ]; then
            downloaded_root="$RUNNER_TEMP/openpath-existing-release-assets"
            mkdir -p "$downloaded_root"
            gh release download "$TAG" \
              --pattern "openpath-linux-v${VERSION}.tar.gz" \
              --pattern "openpath-linux-v${VERSION}.tar.gz.sha256" \
              --pattern "windows-v${VERSION}.zip" \
              --pattern "windows-v${VERSION}.zip.sha256" \
              --pattern "OpenPath-Windows-Setup-Template.exe" \
              --pattern "OpenPath-Windows-Setup-Template.exe.sha256" \
              --pattern "payload-manifest.json" \
              --dir "$downloaded_root"

            node scripts/verify-openpath-release-assets.mjs verify-existing-release \
              --release-json "$release_json" \
              --expected-tag "$TAG" \
              --local-root . \
              --downloaded-root "$downloaded_root" \
              --asset "openpath-linux-v${VERSION}.tar.gz=openpath-linux-v${VERSION}.tar.gz" \
              --asset "openpath-linux-v${VERSION}.tar.gz.sha256=openpath-linux-v${VERSION}.tar.gz.sha256" \
              --asset "windows-v${VERSION}.zip=windows-v${VERSION}.zip" \
              --asset "windows-v${VERSION}.zip.sha256=windows-v${VERSION}.zip.sha256" \
              --asset "OpenPath-Windows-Setup-Template.exe=windows-offline-template-assets/OpenPath-Windows-Setup-Template.exe" \
              --asset "OpenPath-Windows-Setup-Template.exe.sha256=windows-offline-template-assets/OpenPath-Windows-Setup-Template.exe.sha256" \
              --asset "payload-manifest.json=windows-offline-template-assets/payload-manifest.json"
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$response_status" = "404" ]; then
            echo "No existing GitHub Release for $TAG; creation is required."
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=GitHub Release lookup failed::Expected HTTP 200 or 404 for $TAG, got $response_status."
            cat "$release_json"
            exit 1
          fi

      - name: Create GitHub Release
        if: steps.existing-release.outputs.release_exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.release_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            openpath-linux-v${{ steps.vars.outputs.version }}.tar.gz
            openpath-linux-v${{ steps.vars.outputs.version }}.tar.gz.sha256
            windows-v${{ steps.vars.outputs.version }}.zip
            windows-v${{ steps.vars.outputs.version }}.zip.sha256
            windows-offline-template-assets/OpenPath-Windows-Setup-Template.exe
            windows-offline-template-assets/OpenPath-Windows-Setup-Template.exe.sha256
            windows-offline-template-assets/payload-manifest.json
          body: |
            ## 🚀 Installation Scripts Release

            **Version:** ${{ steps.vars.outputs.version }}  
            **Commit:** ${{ steps.vars.outputs.short_sha }}

            ### 📦 Assets

            - **`openpath-linux-v${{ steps.vars.outputs.version }}.tar.gz`** - Linux installation scripts
            - **`openpath-linux-v${{ steps.vars.outputs.version }}.tar.gz.sha256`** - SHA256 checksum (sha256sum -c format)
            - **`windows-v${{ steps.vars.outputs.version }}.zip`** - Windows installation scripts
            - **`windows-v${{ steps.vars.outputs.version }}.zip.sha256`** - SHA256 checksum (sha256sum -c format)

            ### 📝 Installation

            **Linux:**
            ```bash
            # Download and extract
            wget https://github.com/balejosg/openpath/releases/download/${{ steps.vars.outputs.tag }}/openpath-linux-v${{ steps.vars.outputs.version }}.tar.gz
            tar -xzf openpath-linux-v${{ steps.vars.outputs.version }}.tar.gz

            # Run installer
            cd linux && sudo bash install.sh
            ```

            **Windows (PowerShell as Administrator):**
            ```powershell
            # Download and extract
            Invoke-WebRequest -Uri "https://github.com/balejosg/openpath/releases/download/${{ steps.vars.outputs.tag }}/windows-v${{ steps.vars.outputs.version }}.zip" -OutFile "windows.zip"
            Expand-Archive -Path "windows.zip" -DestinationPath "."

            # Run installer
            cd windows
            .\Install-OpenPath.ps1
            ```

            ### 📋 What's Included

            **Linux Package:**
            - Main installer (`install.sh`)
            - Uninstaller (`uninstall.sh`)
            - Library modules (`lib/`)
            - Runtime scripts (`scripts/`)
            - Shared runtime assets (`runtime/`)
            - Firefox extension (`firefox-extension/`)

            **Windows Package:**
            - PowerShell installer (`Install-OpenPath.ps1`)
            - PowerShell uninstaller (`Uninstall-OpenPath.ps1`)
            - Library modules (`lib/*.psm1`)
            - Runtime scripts (`scripts/*.ps1`)
            - Shared runtime assets (`runtime/`)
            - Configuration files

            ---

            ⚠️ **Note:** This is a pre-release. Please test in a non-production environment first.

      - name: Release summary
        if: success()
        run: |
          echo "## ✅ Release Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.vars.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.vars.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ steps.vars.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Released Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- openpath-linux-v${{ steps.vars.outputs.version }}.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- openpath-linux-v${{ steps.vars.outputs.version }}.tar.gz.sha256" >> $GITHUB_STEP_SUMMARY
          echo "- windows-v${{ steps.vars.outputs.version }}.zip" >> $GITHUB_STEP_SUMMARY
          echo "- windows-v${{ steps.vars.outputs.version }}.zip.sha256" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.vars.outputs.tag }})" >> $GITHUB_STEP_SUMMARY

  release-scripts-success:
    name: Release Scripts Success
    runs-on: ubuntu-latest
    needs:
      [
        windows-offline-template,
        policy-converter-contrast,
        policy-converter-contrast-bundle,
        windows-personalized-http-e2e,
        windows-desktop-survival,
        release,
      ]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Require the complete canonical release chain
        run: |
          if [[ "${{ needs.windows-offline-template.result }}" != "success" ]] || \
             [[ "${{ needs.policy-converter-contrast.result }}" != "success" ]] || \
             [[ "${{ needs.policy-converter-contrast-bundle.result }}" != "success" ]] || \
             [[ "${{ needs.windows-personalized-http-e2e.result }}" != "success" ]] || \
             [[ "${{ needs.windows-desktop-survival.result }}" != "success" ]] || \
             [[ "${{ needs.release.result }}" != "success" ]]; then
            echo "Canonical same-SHA Windows release proof is incomplete or failed."
            exit 1
          fi
          echo "Canonical same-SHA Windows release proof is green."
