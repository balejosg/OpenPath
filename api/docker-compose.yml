# OpenPath API Docker Compose Configuration
# For local development and simple deployments
#
# Usage:
#   docker compose -f api/docker-compose.yml up        # Provision, then start the API
#   docker compose -f api/docker-compose.yml up -d     # Start in background
#   docker compose -f api/docker-compose.yml logs -f   # View logs
#   docker compose -f api/docker-compose.yml down      # Stop and remove containers

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: openpath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-openpath}
      POSTGRES_USER: ${DB_USER:-openpath}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openpath_dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-openpath}']
      interval: 10s
      timeout: 5s
      retries: 5

  windows-offline-installer-provision:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: openpath-windows-offline-installer-provision
    restart: 'no'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_DIR=/app/var/windows-offline-installer/templates
      - OPENPATH_WINDOWS_OFFLINE_ARTIFACTS_DIR=/app/var/windows-offline-installer/artifacts
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_VERSION=${OPENPATH_WINDOWS_OFFLINE_TEMPLATE_VERSION:?OPENPATH_WINDOWS_OFFLINE_TEMPLATE_VERSION is required}
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_COMMIT=${OPENPATH_WINDOWS_OFFLINE_TEMPLATE_COMMIT:?OPENPATH_WINDOWS_OFFLINE_TEMPLATE_COMMIT is required}
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_SHA256=${OPENPATH_WINDOWS_OFFLINE_TEMPLATE_SHA256:?OPENPATH_WINDOWS_OFFLINE_TEMPLATE_SHA256 is required}
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_RELEASE_TAG=${OPENPATH_WINDOWS_OFFLINE_TEMPLATE_RELEASE_TAG:?OPENPATH_WINDOWS_OFFLINE_TEMPLATE_RELEASE_TAG is required}
      - OPENPATH_WINDOWS_OFFLINE_ARTIFACT_RETENTION_HOURS=${OPENPATH_WINDOWS_OFFLINE_ARTIFACT_RETENTION_HOURS:-24}
      - OPENPATH_GITHUB_REPO=${OPENPATH_GITHUB_REPO:-balejosg/openpath}
    command:
      - sh
      - -ec
      - |
        node dist/scripts/provision-windows-offline-installer.js
        node dist/scripts/provision-windows-offline-installer.js --verify-only
    volumes:
      - windows_offline_installer_templates:/app/var/windows-offline-installer/templates

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: openpath-api
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - HOST=0.0.0.0
      - PUBLIC_URL=${PUBLIC_URL:?PUBLIC_URL is required for public installer links}
      - TRUST_PROXY=${TRUST_PROXY:-}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-openpath}
      - DB_USER=${DB_USER:-openpath}
      - DB_PASSWORD=${DB_PASSWORD:-openpath_dev}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-me-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_OWNER=${GITHUB_OWNER:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - GITHUB_BRANCH=${GITHUB_BRANCH:-main}
      - DEFAULT_GROUP=${DEFAULT_GROUP:-informatica-3}
      - SHARED_SECRET=${SHARED_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-200}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SLOW_REQUEST_THRESHOLD_MS=${SLOW_REQUEST_THRESHOLD_MS:-1000}
      - REDIS_URL=${REDIS_URL:-}
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_DIR=/app/var/windows-offline-installer/templates
      - OPENPATH_WINDOWS_OFFLINE_ARTIFACTS_DIR=/app/var/windows-offline-installer/artifacts
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_VERSION=${OPENPATH_WINDOWS_OFFLINE_TEMPLATE_VERSION:?OPENPATH_WINDOWS_OFFLINE_TEMPLATE_VERSION is required}
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_COMMIT=${OPENPATH_WINDOWS_OFFLINE_TEMPLATE_COMMIT:?OPENPATH_WINDOWS_OFFLINE_TEMPLATE_COMMIT is required}
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_SHA256=${OPENPATH_WINDOWS_OFFLINE_TEMPLATE_SHA256:?OPENPATH_WINDOWS_OFFLINE_TEMPLATE_SHA256 is required}
      - OPENPATH_WINDOWS_OFFLINE_TEMPLATE_RELEASE_TAG=${OPENPATH_WINDOWS_OFFLINE_TEMPLATE_RELEASE_TAG:?OPENPATH_WINDOWS_OFFLINE_TEMPLATE_RELEASE_TAG is required}
      - OPENPATH_WINDOWS_OFFLINE_ARTIFACT_RETENTION_HOURS=${OPENPATH_WINDOWS_OFFLINE_ARTIFACT_RETENTION_HOURS:-24}
      - OPENPATH_GITHUB_REPO=${OPENPATH_GITHUB_REPO:-balejosg/openpath}
    depends_on:
      db:
        condition: service_healthy
      windows-offline-installer-provision:
        condition: service_completed_successfully
    volumes:
      # Persist logs
      - api-logs:/app/logs
      # The API can only read the provisioned immutable template.
      - windows_offline_installer_templates:/app/var/windows-offline-installer/templates:ro
      # Generated personalized installers remain private and persistent for their TTL.
      - windows_offline_installer_artifacts:/app/var/windows-offline-installer/artifacts
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/ready']
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_data:
  api-logs:
  windows_offline_installer_templates:
  windows_offline_installer_artifacts:
